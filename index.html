<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Davide Lanotte — sviluppatore a Roma</title>
<meta name="description" content="Sviluppatore a Roma: siti, app, gestionali, bot e automazioni. Faccio fare ai computer il lavoro che oggi fai a mano.">
<meta property="og:title" content="Davide Lanotte — sviluppatore">
<meta property="og:description" content="Siti, app, gestionali, bot e automazioni. Raccontami il problema, anche se non sai come si chiama.">
<meta property="og:image" content="assets/davide.jpg">
<meta name="theme-color" content="#07080A">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..700&family=Geist:wght@300;400;500&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="dz-scroll" class="dz scroller">
<div class="spacer">
<div class="sticky">

  <div id="stage" class="stage">
    <svg id="scene-svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <path class="w-g" id="p-g"></path>
      <path class="w-l" id="p-l"></path>
      <path class="w-n1" id="p-n1"></path>
      <path class="w-a1" id="p-a1"></path>
      <path class="w-p" id="p-p"></path>
      <path class="w-n0" id="p-n0"></path>
      <path class="w-a0" id="p-a0"></path>
    </svg>
    <div id="pins"></div>
  </div>

  <div class="vignette"></div>
  <svg class="grain" aria-hidden="true"><filter id="dz-grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence></filter><rect width="100%" height="100%" filter="url(#dz-grain)"></rect></svg>

  <main id="scenes"></main>

  <header id="hud-top" class="hud-top">
    <button type="button" id="to-top" class="logo">davide<span>.zip</span></button>
    <button type="button" id="to-end" class="cta ghost small">Scrivimi</button>
  </header>

  <footer id="hud-bottom" class="hud-bottom">
    <span class="count"><span id="sc" class="acc">01</span> / 10</span>
    <div class="track"><div id="prog" class="fill"></div></div>
  </footer>

  <div id="hint" class="hint bob">Scorri ↓</div>

  <div id="splash" class="splash" role="button" tabindex="0" aria-label="Avvio: estrazione di davide.zip. Clic per saltare"></div>

</div>
</div>
</div>
<noscript><div style="padding:40px;color:#ECEAE4;font-family:sans-serif">Davide Lanotte — sviluppatore a Roma. Scrivimi: <a href="mailto:info@davidelanotte.com">info@davidelanotte.com</a></div></noscript>
<script>window.DZ_PHOTO = 'assets/davide.jpg';</script>
<script src="app.js"></script>
</body>
</html>
